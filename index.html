<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6da34c">
<meta name="application-name" content="植物与僵尸对战乐园">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>植物与僵尸对战乐园</title>
<style>
:root{--ink:#334229;--brown:#6b4b2d;--cream:#fff9df;--green:#6fc64c;--soft:#eef1c9;--shadow:rgba(45,60,31,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(ellipse at 15% 8%,rgba(255,255,255,.9) 0 7%,transparent 8%),linear-gradient(180deg,#7bc2ea 0 37%,#b7d695 37% 68%,#5a814d 68%);padding:22px}
main{width:min(980px,100%);margin:0 auto;background:linear-gradient(180deg,rgba(255,253,235,.98),rgba(229,224,174,.98));border:3px solid var(--brown);border-radius:22px;box-shadow:0 14px 34px var(--shadow);padding:28px}
.hero{text-align:center;margin-bottom:22px}.mark{font-size:58px}.hero h1{margin:6px 0 8px;font-size:34px}.hero p{margin:0;font-weight:800;color:#6f5a36;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mode{display:block;min-height:180px;text-decoration:none;color:inherit;border:3px solid #775637;border-radius:18px;background:linear-gradient(180deg,#fffef1,#ecd49b);box-shadow:0 5px 0 rgba(92,61,30,.2);padding:18px;position:relative;transition:.12s transform,.12s filter}
.mode.ready:hover{transform:translateY(-2px);filter:brightness(1.03)}
.mode .icon{font-size:44px}.mode h2{font-size:24px;margin:8px 0 6px}.mode p{margin:0;line-height:1.5;font-weight:700;color:#715c38}.status{position:absolute;right:13px;top:13px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:1000;border:2px solid #6f8b4d;background:#e9f7cb}.mode.pending{filter:saturate(.55);background:linear-gradient(180deg,#f7f4df,#ddd7b7);cursor:default}.mode.pending .status{background:#eee7d4;border-color:#9b8b70;color:#675d4c}
.note{margin-top:18px;border:2px solid #9c8153;border-radius:13px;background:rgba(255,255,255,.58);padding:12px 14px;text-align:center;font-weight:800;color:#655333;line-height:1.5}
@media(max-width:720px){body{padding:10px}main{padding:18px}.grid{grid-template-columns:1fr}.hero h1{font-size:28px}.mode{min-height:150px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="mark">🌻🧟</div>
    <h1>植物与僵尸对战乐园</h1>
    <p>选择一种玩法。以后新增玩法，也会继续从这个固定入口进入。</p>
  </section>

  <section class="grid" aria-label="玩法选择">
    <div class="mode pending" aria-disabled="true">
      <span class="status">准备中</span>
      <div class="icon">🌻⚔️🧟</div>
      <h2>植物 VS 僵尸</h2>
      <p>用植物守家，对抗僵尸进攻。正式游戏文件尚未接入。</p>
    </div>

    <a class="mode ready" href="./games/zombie-vs-plant/">
      <span class="status">可以玩</span>
      <div class="icon">🧟⚔️🌻</div>
      <h2>僵尸 VS 植物</h2>
      <p>用僵尸突破植物防线。当前已接入正式游戏。</p>
    </a>

    <div class="mode pending" aria-disabled="true">
      <span class="status">准备中</span>
      <div class="icon">🌻⚔️🌻</div>
      <h2>植物 VS 植物</h2>
      <p>植物阵营互相大战。正式游戏文件尚未接入。</p>
    </div>

    <div class="mode pending" aria-disabled="true">
      <span class="status">准备中</span>
      <div class="icon">🧟⚔️🧟</div>
      <h2>僵尸 VS 僵尸</h2>
      <p>僵尸阵营互相大战。正式游戏文件尚未接入。</p>
    </div>
  </section>

  <div class="note">儿童只需要记住这一个入口。代码、版本、仓库和发布都留在成人维护层。</div>
</main>
<script>
"use strict";
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
